<html>
<head>
  <style>
    .container{
      width: 300px;
      height: 300px;
      background-color: #666111;
    }

    .container img{
      width: 100%;
      height: 100%;
    }

  </style>
</head>

<body>
  <h3>fill</h3>
  <div class="container">
    <img src="/moon.jpg" alt="clear sky with moon" class="img">
  </div>
    <h3>contain</h3>
    <div class="container">
      <img src="/moon.jpg" alt="clear sky with moon" class="img" style="object-fit: contain;">
    </div>
      <h3>cover</h3>
      <div class="container">
    <img src="/moon.jpg" alt="clear sky with moon" class="img" style="object-fit: cover;">
  </div>

  <img src="/moon.jpg" alt="" class="container img">
  <img src="/moon.jpg" alt="" class="container img">
</body>
</html>
